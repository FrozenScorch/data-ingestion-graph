name: Studio and SDK CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/init_lan_env.py --host localhost
      - run: docker compose config --format json > compose.json
      - run: python scripts/verify_compose.py compose.json
      - run: >-
          docker run --rm
          -e STUDIO_HOSTNAME=localhost
          -e STUDIO_ORIGIN=http://localhost:8040
          -e STUDIO_HTTPS_PORT=8443
          -v "$PWD/deploy/caddy:/etc/caddy:ro"
          caddy:2.11.4-alpine
          caddy validate --config /etc/caddy/Caddyfile.http --adapter caddyfile
      - run: >-
          docker run --rm
          -e STUDIO_HOSTNAME=localhost
          -e STUDIO_ORIGIN=https://localhost:8443
          -e STUDIO_HTTPS_PORT=8443
          -v "$PWD/deploy/caddy:/etc/caddy:ro"
          caddy:2.11.4-alpine
          caddy validate --config /etc/caddy/Caddyfile.tls --adapter caddyfile

  sdk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: sdk/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "./sdk[dev]"
      - run: python -m ruff check sdk/src sdk/tests
      - run: python -m ruff format --check sdk/src sdk/tests
      - run: python -m mypy
        working-directory: sdk
      - run: python -m pytest tests -q
        working-directory: sdk
      - run: python -m build --outdir ../dist
        working-directory: sdk
      - name: Install the wheel in an isolated dependency-free environment
        run: |
          python -m venv .wheel-smoke
          PIP_DISABLE_PIP_VERSION_CHECK=1 PIP_NO_INDEX=1 \
            .wheel-smoke/bin/python -m pip install --no-deps dist/*.whl
      - name: Verify installed-wheel public API and entry-point groups
        run: |
          .wheel-smoke/bin/python - <<'PY'
          import ingestion_graph as sdk
          from ingestion_graph.plugins import PLUGIN_GROUPS, discover_plugins, load_plugin

          public_api = {
              "PIPELINE_SPEC_VERSION",
              "ComponentRef",
              "ConnectorPlan",
              "ExtensionPlan",
              "PipelinePlan",
              "PipelineRegistry",
              "PipelineSpec",
              "ProviderSpec",
              "StateStoreRef",
              "create_ingestion_pipeline",
              "load_pipeline_spec",
              "plan_ingestion_pipeline",
              "run_ingestion_pipeline",
          }
          assert public_api <= set(sdk.__all__)
          assert sdk.__version__ == "0.8.0"
          provider = sdk.ProviderSpec(
              "example",
              "1",
              {"type": "object", "properties": {}, "additionalProperties": False},
          )
          assert provider.version == "1"

          expected_plugins = {
              "sources": {"discord", "jsonl", "local_documents", "postgres", "rest"},
              "destinations": {"jsonl", "postgres", "sqlite"},
              "transforms": set(),
              "state_stores": {"memory", "sqlite"},
              "ocr_engines": {"tesseract"},
              "page_renderers": {"pdfium"},
              "table_extractors": set(),
              "document_splitters": {"identity"},
              "extraction_caches": {"memory", "sqlite"},
              "vision_extractors": set(),
              "external_processing_policies": set(),
          }
          assert set(PLUGIN_GROUPS) == set(expected_plugins)
          for kind, expected in expected_plugins.items():
              assert set(discover_plugins(kind)) == expected, kind
          for kind in ("sources", "destinations"):
              for name in expected_plugins[kind]:
                  manifest = sdk.load_connector_manifest(kind, name)
                  assert manifest.name == name
          for kind in (
              "state_stores",
              "ocr_engines",
              "page_renderers",
              "document_splitters",
              "extraction_caches",
          ):
              for name in expected_plugins[kind]:
                  assert callable(load_plugin(kind, name))

          spec = sdk.load_pipeline_spec("sdk/examples/jsonl-to-sqlite.toml")
          plan = sdk.plan_ingestion_pipeline(spec)
          pipeline = sdk.create_ingestion_pipeline(spec, plan=plan)
          assert plan.source.plugin == "jsonl"
          assert plan.destination.plugin == "sqlite"
          assert pipeline.state_namespace == plan.state_namespace
          PY
      - name: Smoke-test installed-wheel validate and plan commands
        run: |
          for spec in \
            sdk/examples/jsonl-to-sqlite.toml \
            sdk/examples/local-documents.toml
          do
            .wheel-smoke/bin/ingestion-graph validate "$spec" --json
            .wheel-smoke/bin/ingestion-graph plan "$spec" --json
          done
      - name: Type-check a strict external wheel consumer
        run: >-
          python -m mypy --strict --no-incremental
          --python-executable "$PWD/.wheel-smoke/bin/python"
          sdk/typecheck/consumer.py

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ingestion
          POSTGRES_PASSWORD: ingestion
          POSTGRES_DB: ingestion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ingestion -d ingestion_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://ingestion:ingestion@localhost:5432/ingestion_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r backend/requirements.txt
      - run: python -c "import ingestion_graph; print(ingestion_graph.__version__)"
      - run: python -m pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm run build
